name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
    - name: Validate branch naming convention
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "Tag push detected; skipping branch name check."
          exit 0
        fi

        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          branch="${GITHUB_HEAD_REF}"
        else
          branch="${GITHUB_REF_NAME}"
        fi

        exempt_branches=(main)
        for exempt in "${exempt_branches[@]}"; do
          if [[ "${branch}" == "${exempt}" ]]; then
            echo "Branch '${branch}' is exempt from naming checks."
            exit 0
          fi
        done

        if [[ "${branch}" =~ ^[0-9]+_[a-z0-9_]+$ ]]; then
          echo "Branch '${branch}' matches required issueNumber_branch_title format."
          exit 0
        fi

        echo "::error::Branch '${branch}' does not follow the required 'issueNumber_branch_title' format (e.g. 10_add_testing_env)."
        exit 1

